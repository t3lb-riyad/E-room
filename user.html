<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>حالة الغرفة</title>
  <meta name="description" content="اعرف حالة المضيف الآن وأرسل له تنبيهاً فورياً بضغطة واحدة.">
  <meta name="theme-color" content="#EFE3CE">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="manifest" href="manifest-user.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حالة الغرفة">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="page page--user" data-ready="false">
  <div class="ambient" aria-hidden="true"></div>

  <main class="app">
    <div class="demo-banner" id="demo-banner" role="status" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l9 16H3L12 3z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
      </svg>
      <span>وضع تجريبي — أضف مفاتيح Supabase وFirebase في <bdi>js/config.js</bdi> لتفعيل المزامنة.</span>
    </div>

    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span class="brand-led"></span></span>
        <div class="brand-text">
          <p class="brand-eyebrow">صفحة الزوار</p>
          <h1 class="brand-title">حالة الغرفة</h1>
        </div>
      </div>

      <div class="conn-pill" id="conn-pill" data-state="connecting" role="status" aria-live="polite">
        <span class="conn-dot" aria-hidden="true"></span>
        <span data-conn-label>جارٍ الاتصال</span>
      </div>
    </header>

    <section class="hero-card" id="hero-card" style="--led:#3DDC84" aria-live="polite">
      <p class="hero-eyebrow">
        <span class="hero-eyebrow-line" aria-hidden="true"></span>
        الحالة الآن
      </p>

      <div class="hero-main">
        <span class="led led--xl" aria-hidden="true"></span>
        <div class="hero-copy">
          <h2 class="hero-title" id="hero-title">جارٍ التحميل…</h2>
          <p class="hero-sub" id="hero-sub">ننتظر آخر تحديث من المضيف</p>
        </div>
      </div>

      <div class="hero-meta">
        <span class="hero-time" id="hero-time">جارٍ التحميل…</span>
        <span class="hero-badge" id="hero-notify" data-state="loading">
          <span class="badge-dot" aria-hidden="true"></span>
          جارٍ التحقق…
        </span>
      </div>
    </section>

    <section class="others" aria-labelledby="others-title">
      <div class="others-head">
        <h2 id="others-title">الحالات الأخرى</h2>
        <span>غير مفعّلة</span>
      </div>

      <div class="status-card status-card--soft">
        <div class="status-list" id="other-list">
          <div class="status-skeleton" aria-hidden="true"></div>
          <div class="status-skeleton" aria-hidden="true"></div>
          <div class="status-skeleton" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <p class="user-hint" id="user-hint">
      اضغط على الجرس لإرسال تنبيه فوري إلى المضيف.
    </p>
  </main>

  <button class="fab" id="fab" type="button" disabled aria-label="إرسال تنبيه للمضيف">
    <span class="fab-glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/>
        <path d="M13.7 21a2 2 0 01-3.4 0"/>
      </svg>
      <span class="fab-label" id="fab-label">إرسال تنبيه</span>
    </span>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">هذه الصفحة تحتاج إلى JavaScript لعرض الحالة وإرسال التنبيه.</div>
  </noscript>

  <script src="js/config.js?v=1.2.0"></script>
  <script type="module" src="js/user.js"></script>
</body>
</html>
