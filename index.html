<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>حالة الغرفة — لوحة التحكم</title>
  <meta name="description" content="اختر حالتك الحالية ليظهر التحديث فوراً لمن يفتح صفحة الزوار.">
  <meta name="theme-color" content="#EFE3CE">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حالة الغرفة">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="page page--admin" data-ready="false">
  <div class="ambient" aria-hidden="true"></div>

  <main class="app">
    <div class="demo-banner" id="demo-banner" role="status" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l9 16H3L12 3z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
      </svg>
      <span>وضع تجريبي — أضف مفاتيح Supabase وFirebase في <bdi>js/config.js</bdi> لتفعيل المزامنة.</span>
    </div>

    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span class="brand-led"></span></span>
        <div class="brand-text">
          <p class="brand-eyebrow">لوحة التحكم</p>
          <h1 class="brand-title">حالة الغرفة</h1>
        </div>
      </div>

      <div class="conn-pill" id="conn-pill" data-state="connecting" role="status" aria-live="polite">
        <span class="conn-dot" aria-hidden="true"></span>
        <span data-conn-label>جارٍ الاتصال</span>
      </div>
    </header>

    <section class="intro">
      <h2>كيف حالك الآن؟</h2>
      <p>اختر حالتك، وسيظهر التغيير فوراً لكل من يفتح صفحة الزوار.</p>
    </section>

    <section class="status-card" aria-labelledby="status-heading">
      <div class="card-head">
        <div>
          <h3 class="card-label" id="status-heading">الحالة الحالية</h3>
          <p class="last-updated" id="last-updated">جارٍ التحميل…</p>
        </div>
        <span class="live-tag"><span class="live-dot" aria-hidden="true"></span>مباشر</span>
      </div>

      <div class="status-list" id="status-list" role="radiogroup" aria-label="اختر حالتك الحالية">
        <div class="status-skeleton" aria-hidden="true"></div>
        <div class="status-skeleton" aria-hidden="true"></div>
        <div class="status-skeleton" aria-hidden="true"></div>
        <div class="status-skeleton" aria-hidden="true"></div>
      </div>
    </section>

    <footer class="admin-footer">
      <button class="push-btn" id="push-btn" type="button" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/>
          <path d="M13.7 21a2 2 0 01-3.4 0"/>
        </svg>
        <span id="push-label">تفعيل الإشعارات</span>
      </button>
      <p class="footnote" id="push-note">جارٍ التحقق من حالة الإشعارات…</p>

      <button class="install-btn" id="install-btn" type="button" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/>
        </svg>
        تثبيت التطبيق على الشاشة الرئيسية
      </button>

      <a class="text-link" href="user.html">عرض صفحة الزوار ←</a>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">هذه الصفحة تحتاج إلى JavaScript لعرض الحالة وتحديثها.</div>
  </noscript>

  <script src="js/config.js?v=1.2.0"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
