<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="حالة الغرفة">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E3323"/>
      <stop offset="1" stop-color="#2A2215"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3F4F12"/>
      <stop offset="1" stop-color="#2C380B"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3DDC84" stop-opacity=".85"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CF7BC"/>
      <stop offset="1" stop-color="#2FD874"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="20.5" fill="url(#plate)"/>
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width=".8"/>
  <circle cx="32" cy="32" r="15" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="6.4" fill="url(#led)"/>
  <circle cx="29.8" cy="29.8" r="2" fill="#FFFFFF" fill-opacity=".5"/>
</svg>
